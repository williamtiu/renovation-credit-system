<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>R1-7A · SECTION 02 · 驗證與落地</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="global.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  body { margin:0; background:var(--bg); }
  .giant-num {
    font-family:'Space Grotesk', 'Noto Sans TC', sans-serif;
    font-weight:700; font-size:210px; line-height:.8; letter-spacing:-.01em;
    color:rgba(255,107,26,.10);
    -webkit-text-stroke:3px rgba(255,107,26,.85);
  }
  .sec-chip { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; background:var(--surface-2); padding:9px 18px; font-family:var(--font-cn); font-size:12.5px; color:var(--primary); }
</style>
</head>
<body>
<div class="slide">

  <div class="grid-bg" data-decor aria-hidden="true"></div>
  <div data-decor aria-hidden="true" style="position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent);"></div>
  <div data-decor aria-hidden="true" style="position:absolute; left:36px; top:48px; width:580px; height:430px; background:radial-gradient(closest-side, rgba(255,107,26,.09), transparent 70%);"></div>

  <div class="kicker" style="position:absolute; left:88px; top:66px;">SECTION</div>

  <!-- 巨型章節編號 -->
  <div style="position:absolute; left:84px; top:122px; display:flex; align-items:flex-end; gap:22px;">
    <div class="giant-num">02</div>
    <div class="num" style="font-size:30px; color:var(--muted); padding-bottom:14px;">/ 02</div>
  </div>

  <!-- 章節標題 -->
  <div style="position:absolute; left:88px; top:346px;">
    <h1 style="font-family:var(--font-cn); font-weight:900; font-size:var(--fs-display); line-height:1.1; color:var(--primary); letter-spacing:.03em;">驗證與落地</h1>
    <p style="margin-top:18px; font-size:18px; color:var(--muted); letter-spacing:.04em; font-family:var(--font-cn);">實測數據説話 · 真機部署路徑已鋪好</p>
  </div>

  <!-- 右下角 chip 預告 -->
  <div style="position:absolute; right:64px; bottom:60px; display:flex; gap:12px;">
    <span class="sec-chip"><i class="material-icons" style="font-size:15px; color:var(--muted);">grid_view</i>E2E 驗證矩陣</span>
    <span class="sec-chip"><i class="material-icons" style="font-size:15px; color:var(--muted);">inventory_2</i>真機部署包</span>
    <span class="sec-chip"><i class="material-icons" style="font-size:15px; color:var(--muted);">map</i>路線圖</span>
  </div>

</div>
</body>
</html>
