<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>R1-7A · 06 · TRAJECTORY</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="global.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  body { margin:0; background:var(--bg); }
  .shot-label { display:flex; align-items:center; gap:9px; font-family:var(--font-cn); font-weight:600; font-size:var(--fs-small); color:var(--primary); }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .step-title { font-family:var(--font-cn); font-weight:700; font-size:16px; color:var(--primary); }
  .step-desc { font-size:var(--fs-small); line-height:1.6; color:var(--muted); margin-top:8px; }
  .step-card { display:flex; flex-direction:column; min-height:136px; padding:20px 20px; }
  .spacer { flex:1 1 0; min-height:16px; }
</style>
</head>
<body>
<div class="slide" style="padding:48px 64px 44px; display:flex; flex-direction:column;">

  <header style="display:flex; align-items:flex-end; justify-content:space-between; flex:0 0 auto;">
    <div>
      <div class="kicker">06 · TRAJECTORY</div>
      <h1 style="font-family:var(--font-heading); font-weight:900; font-size:var(--fs-h1); line-height:1.15; margin-top:9px; color:var(--primary);">錄一次，回放無限次</h1>
    </div>
    <p style="font-size:var(--fs-body); color:var(--muted); padding-bottom:5px;">從示教到量產循環，一條龍完成</p>
  </header>

  <div class="spacer" data-decor aria-hidden="true"></div>

  <!-- 全寬錄製面板橫幅（原生比例 5.28:1） -->
  <div style="flex:0 0 auto;">
    <div class="shot-label" style="margin-bottom:10px;">
      <span class="dot" style="background:var(--red); box-shadow:0 0 10px rgba(248,113,113,.8);"></span>
      <span>錄製中</span><span style="color:var(--muted); font-weight:500;">— 計時 / 點數 / <span class="num">20Hz</span> 採樣即時顯示</span>
    </div>
    <div class="shot" style="height:218px;"><img src="shot-traj-hero.png" alt="軌跡錄製面板 — 狀態、計時與點數即時顯示"></div>
  </div>

  <div class="spacer" data-decor aria-hidden="true"></div>

  <!-- 三段流程 -->
  <div style="display:flex; align-items:stretch; gap:12px; flex:0 0 auto;">
    <div class="card step-card" style="flex:1;">
      <div style="display:flex; align-items:center; gap:10px;"><span style="font-family:var(--font-cn); font-weight:900; font-size:19px; color:var(--accent);">①</span><span class="step-title">錄製</span></div>
      <p class="step-desc"><span class="num">20Hz</span> 採樣關節路徑點，實測 <span class="num" style="color:var(--primary);">38</span> 點 / <span class="num" style="color:var(--primary);">18</span> 秒</p>
    </div>
    <div style="display:flex; align-items:center; flex-shrink:0;"><span class="num" style="font-size:24px; color:var(--accent); font-weight:600;">→</span></div>
    <div class="card step-card" style="flex:1;">
      <div style="display:flex; align-items:center; gap:10px;"><span style="font-family:var(--font-cn); font-weight:900; font-size:19px; color:var(--accent);">②</span><span class="step-title">保存</span></div>
      <p class="step-desc"><span class="num">Trajectory</span> 入庫（<span class="num">Prisma SQLite</span>）· 點數/時長自動記錄</p>
    </div>
    <div style="display:flex; align-items:center; flex-shrink:0;"><span class="num" style="font-size:24px; color:var(--accent); font-weight:600;">→</span></div>
    <div class="card step-card" style="flex:1;">
      <div style="display:flex; align-items:center; gap:10px;"><span style="font-family:var(--font-cn); font-weight:900; font-size:19px; color:var(--accent);">③</span><span class="step-title">回放</span></div>
      <p class="step-desc"><span class="num" style="color:var(--primary);">0.5× / 1× / 2×</span> 速度，逐點 <span class="num">goto</span> + 進度條即時回報</p>
    </div>
  </div>

  <div class="spacer" data-decor aria-hidden="true"></div>

  <!-- 底部：安全提示帶（圓角與卡片一致 14px） -->
  <div style="flex:0 0 auto; border:1px solid rgba(248,113,113,.35); background:rgba(248,113,113,.07); border-radius:14px; padding:16px 20px; display:flex; align-items:center; gap:13px;">
    <i class="material-icons" style="font-size:22px; color:var(--red); flex-shrink:0;">shield</i>
    <p style="font-size:var(--fs-small); line-height:1.55; color:var(--primary);"><span style="font-weight:700; color:var(--red);">回放安全</span> — E-stop 每步檢查自動中止 · <span class="num">cancel</span> 即時停臂（<span class="num">max|dq| = 0</span>）· 並發回放請求 <span class="num">409</span> 拒絕</p>
  </div>

</div>
</body>
</html>
